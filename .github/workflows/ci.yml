name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  db-tests:
    name: migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # config.toml ссылается на env(GOOGLE_*); в CI Google не нужен, хватает пустых значений.
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      # Тестам email владельца не нужен (они создают своих пользователей), но значение не личное.
      ADMIN_EMAIL: owner@example.com
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start Postgres
        run: supabase db start

      - name: Apply migrations on a clean database
        run: supabase db reset

      - name: Run database tests
        run: supabase test db

  web:
    name: web typecheck + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  edge-functions:
    name: edge functions (deno test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x

      - run: deno fmt --check
      - run: deno lint
      - run: deno check fetch_rates/index.ts export/index.ts
      # Тесты не ходят в сеть: HTTP к Нацбанку, кэш и выборки экспорта подменяются в *_test.ts.
      - run: deno test
